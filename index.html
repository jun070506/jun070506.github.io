<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="서울대 첨단융합학부 26학번 송상준의 개인 홈페이지입니다.">
  <title>송상준 | 개인 홈페이지</title>
  <style>
    :root {
      --background: #f4f7f5;
      --surface: rgba(255, 255, 255, 0.86);
      --text: #17211b;
      --muted: #5e6d63;
      --accent: #237a57;
      --accent-soft: #dff3e9;
      --border: #dce6df;
      --shadow: 0 18px 50px rgba(35, 67, 51, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #dff3e9 0, transparent 34rem),
        var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
    }

    .page {
      width: min(100% - 32px, 920px);
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 12px 0 44px;
    }

    .logo {
      font-weight: 800;
      letter-spacing: -0.03em;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.95rem;
      text-decoration: none;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--accent);
    }

    .hero {
      padding: 68px 0 88px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 0.86rem;
      font-weight: 700;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 720px;
      margin-bottom: 22px;
      font-size: clamp(2.6rem, 8vw, 5rem);
      line-height: 1.08;
      letter-spacing: -0.055em;
    }

    .hero p {
      max-width: 620px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.8vw, 1.3rem);
    }

    .sections {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .card:first-child {
      grid-column: 1 / -1;
    }

    h2 {
      margin-bottom: 14px;
      font-size: 1.35rem;
      letter-spacing: -0.025em;
    }

    .card p {
      margin-bottom: 0;
      color: var(--muted);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tags li {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 0.92rem;
    }

    .contact-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .contact-list a {
      color: var(--accent);
      font-weight: 650;
      text-underline-offset: 4px;
    }

    footer {
      padding-top: 40px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 24px, 920px);
        padding-top: 14px;
      }

      .nav {
        align-items: flex-start;
        padding-bottom: 22px;
      }

      .nav-links {
        gap: 12px;
        font-size: 0.88rem;
      }

      .hero {
        padding: 48px 0 60px;
      }

      .sections {
        grid-template-columns: 1fr;
      }

      .card:first-child {
        grid-column: auto;
      }

      .card {
        padding: 24px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <nav class="nav" aria-label="주요 메뉴">
        <a class="logo" href="#top">송상준</a>
        <ul class="nav-links">
          <li><a href="#about">소개</a></li>
          <li><a href="#interests">관심사</a></li>
          <li><a href="#contact">연락처</a></li>
        </ul>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <span class="eyebrow">반갑습니다 👋</span>
        <h1 id="hero-title">안녕하세요.<br>송상준입니다.</h1>
        <p>서울대 첨단융합학부에 재학 중인 26학번입니다. 이곳에 저의 관심사와 이야기를 차근차근 기록합니다.</p>
      </section>

      <div class="sections">
        <section class="card" id="about">
          <h2>소개</h2>
          <p>안녕하세요! 서울대 첨단융합학부 재학 중인 26학번 송상준입니다!</p>
        </section>

        <section class="card" id="interests">
          <h2>관심사</h2>
          <ul class="tags" aria-label="관심사 목록">
            <li>웹 개발</li>
            <li>새로운 기술 배우기</li>
            <li>아이디어 기록하기</li>
          </ul>
        </section>

        <section class="card" id="contact">
          <h2>연락처</h2>
          <ul class="contact-list">
            <li><a href="https://github.com/jun070506">GitHub @jun070506</a></li>
            <li><a href="mailto:jun070506@snu.ac.kr">jun070506@snu.ac.kr</a></li>
          </ul>
        </section>
      </div>
    </main>

    <footer>
      <p>© 2026 송상준. GitHub Pages로 만들었습니다.</p>
    </footer>
  </div>
</body>
</html>
